apiVersion: skaffold/v4beta3
kind: Config
manifests:
  rawYaml:
    - ./infra/k8s/*
build:
  local:
    push: false
  # local and googleCloudBuild cannot be used together
  # googleCloudBuild:
  #   projectId: ticketing-dev-497014
  artifacts:
    # - image: us.gcr.io/ticketing-dev-497014/auth
    - image: rbsuraj1/auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: "."
  